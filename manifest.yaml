guid: b7e3f1a2-4d8c-49f5-a6b1-c2d3e4f56789
name: testSetReleaseMapper
caption: Test Set Release Mapper
summary: Maps all test cases in a selected test set to a chosen active release in a single operation.
description: >-
  Adds a toolbar button to the Test Set List page that allows users to map all test cases
  within a selected test set to a chosen release. The SpiraApp retrieves active releases,
  presents a dropdown for selection, fetches the test cases in the test set, and creates
  release/test case mappings in a single API call.
productSummary: Maps test set test cases to a release via a toolbar button on the Test Set List page.
productDescription: >-
  This SpiraApp adds a "Map to Release" button to the Test Set List page toolbar. Select a
  single test set, click the button, choose an active release from the dropdown, and all test
  cases in that test set will be mapped to the chosen release automatically.
